<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ديون معرض دجلة</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f9f4;--card:#fbfefb;--ink:#12301f;--mut:#6b7f72;--g:#4fb36a;--gd:#1f6b3a;--gl:#e3f3e7;--y:#e6b422;--yl:#fbf1d3;--line:#d3e7d8;--red:#b83a2c;--redl:#fbe4e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a12;--card:#16261b;--ink:#e6f4ea;--mut:#9bb3a2;--gl:#1c3324;--yl:#3a3216;--line:#27422f;--redl:#3b1d19;--red:#f08a7d}}
:root[data-theme="dark"]{--bg:#0e1a12;--card:#16261b;--ink:#e6f4ea;--mut:#9bb3a2;--gl:#1c3324;--yl:#3a3216;--line:#27422f;--redl:#3b1d19;--red:#f08a7d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:16px}
#app{max-width:520px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;gap:10px;padding:14px 0}
header h2{margin:0;font-size:22px;font-weight:800;color:var(--gd)}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;margin-inline-start:auto}
.date{color:var(--g);font-weight:500;margin-top:8px}
h1{margin:2px 0 6px;font-size:36px;font-weight:800;line-height:1.2}
.sub{color:var(--mut);margin:0 0 18px}
.hero{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:18px;border:1px solid var(--g);border-radius:28px;background:linear-gradient(135deg,var(--gl),var(--card));color:var(--ink);font-family:inherit;cursor:pointer;position:relative;overflow:hidden}
.hero .ic{flex:none;width:70px;height:70px;border-radius:22px;background:var(--g);display:grid;place-items:center;font-size:34px;color:#fff}
.hero b{display:block;font-size:24px}.hero span{color:var(--mut);font-size:15px}
.hero i{position:absolute;inset:auto 18px 10px;height:10px;border-bottom:3px solid var(--y);background:repeating-linear-gradient(90deg,var(--y) 0 2px,transparent 2px 12px);opacity:.9}
.hero{padding-bottom:34px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px}
.st small{color:var(--mut);font-size:14px}.st div{font-size:30px;font-weight:800;margin-top:6px}
.st.r div{color:var(--red)}.st.g div{color:var(--gd)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px 6px;text-align:center;font:700 16px 'Tajawal',sans-serif;color:var(--ink);cursor:pointer}
.tile u{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 10px;border-radius:18px;background:var(--gl);border:1px solid var(--line);font-size:26px;text-decoration:none}
.tile.y u{background:var(--yl)}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--g)}
.row{display:grid;grid-template-columns:2fr 1fr 1.2fr auto;gap:6px;align-items:center;margin-bottom:8px}
.row input{padding:10px 8px;border-radius:12px;min-width:0}
.row b{font-size:13px;white-space:nowrap}
.row button{border:0;background:var(--redl);color:var(--red);border-radius:10px;width:30px;height:30px;font-size:16px}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;margin-top:14px;font:800 18px 'Tajawal',sans-serif;background:var(--g);color:#fff;cursor:pointer}
.btn.o{background:var(--card);color:var(--gd);border:1px solid var(--g)}
.tot{display:flex;justify-content:space-between;padding:14px 16px;margin-top:6px;border-radius:18px;background:var(--yl);font-weight:800;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:10px}
.cu{display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;color:inherit;text-align:start;cursor:pointer}
.cu small{color:var(--mut);display:block}
.pos{color:var(--red);font-weight:800}.zero{color:var(--gd);font-weight:800}
.tx{border-bottom:1px dashed var(--line);padding:10px 0}.tx:last-child{border:0}
.tx .h{display:flex;justify-content:space-between;font-weight:700}
.tx small{color:var(--mut)}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;margin-inline-end:6px}
.tag.d{background:var(--redl);color:var(--red)}.tag.p{background:var(--gl);color:var(--gd)}
.del{border:0;background:none;color:var(--mut);font:inherit;font-size:13px;cursor:pointer;padding:2px 0}
.vch{border:2px solid var(--g);border-radius:22px;padding:20px;background:var(--card)}
.vch h3{margin:0 0 12px;text-align:center;font-size:24px;color:var(--gd)}
.vch p{display:flex;justify-content:space-between;margin:8px 0;gap:10px}
.empty{text-align:center;color:var(--mut);padding:26px 0}
#toast{position:fixed;inset:auto 0 calc(24px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--gd);color:#fff;padding:10px 18px;border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
.pd{position:absolute;top:0;left:-10000px;width:794px;padding:40px;background:#fff;color:#111;font-family:'Tajawal',sans-serif;direction:rtl;font-size:16px}
.pd .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #4fb36a;padding-bottom:10px;margin-bottom:18px;font-size:28px;color:#1f6b3a}
.pd .ph span{font-size:20px;color:#111}
.pd table{width:100%;border-collapse:collapse;margin:12px 0}
.pd th{background:#e3f3e7;color:#1f6b3a}
.pd th,.pd td{border:1px solid #cfe3d4;padding:8px 10px;text-align:right}
.pd .tt{background:#fbf1d3;font-weight:800;padding:12px 16px;display:flex;justify-content:space-between;margin-top:10px;border-radius:8px;font-size:20px}
.pd p{display:flex;justify-content:space-between;margin:10px 0;font-size:18px}
.pd .pf{margin-top:24px;color:#777;font-size:13px;text-align:center}
.pd .vb{border:2px solid #4fb36a;border-radius:14px;padding:20px}
.pd .bn{display:block;width:794px;margin:-40px -40px 14px}
.pd .pt{font-size:22px;color:#0b2a7a;font-weight:800;text-align:center;margin:6px 0 12px}
.pd th{background:#0b2a7a;color:#fff}
.pd th,.pd td{border-color:#0b2a7a}
.pd .tt{background:#fff3b0;color:#0b2a7a}
.pd .bl{display:flex;align-items:flex-end;gap:10px;margin:8px 0;font-size:19px;color:#0b2a7a;font-weight:800}
.pd .bl i{flex:1;font-style:normal;border-bottom:2px dotted #0b2a7a;text-align:center;padding:0 8px;color:#111}
.pd .bl span{color:#111}
.pd .inv{border:3px solid #0b2a7a;margin:10px 0 0}
.pd .inv th{border:0;border-inline-start:3px solid #fff;font-size:18px;text-align:center}
.pd .inv td{border:0;border-inline-start:3px solid #0b2a7a;border-bottom:1.5px dotted #4a6fc4;height:38px;padding:2px 8px;text-align:center}
.pd .inv tr.sm td{border-top:3px solid #0b2a7a;border-bottom:0;font-weight:800;color:#0b2a7a;height:46px;font-size:19px}
.pd .ft{display:flex;justify-content:space-between;margin-top:14px;font-weight:800;color:#0b2a7a;font-size:17px}
.pd.v{height:559px;overflow:hidden;padding:14px 30px;font-weight:700}
.pd .vlg{display:block;width:380px;margin:0 auto 6px}
.pd .vbar{border:2px solid #2b3a67;border-radius:14px;text-align:center;font-size:20px;font-weight:800;padding:5px;margin-bottom:8px}
.pd .vr{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.pd .bx{width:200px;text-align:right}.pd .bx b{font-size:19px;display:block}
.pd .box{border:2px solid #2b3a67;height:46px;display:flex;align-items:center;justify-content:center;font-size:24px}
.pd .no{color:#c0392b;font-size:26px;font-weight:800;direction:ltr;text-align:left}
.pd .vt{color:#e0463a;font-size:34px;font-weight:800}
.pd .vl{display:flex;align-items:flex-end;gap:10px;margin:8px 0;font-size:21px}
.pd .vl i{flex:1;font-style:normal;border-bottom:2px dotted #333;text-align:center;min-height:30px;font-size:20px;padding:0 6px}
.pd .vf{display:flex;justify-content:space-between;color:#e0463a;font-size:22px;font-weight:800;margin:12px 70px 0}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 16px 'Tajawal',sans-serif;cursor:pointer}
.seg button.on{background:var(--g);border-color:var(--g);color:#fff}
.st .d2{font-size:20px;margin-top:0}
.pd .vlg{width:340px}.pd .box{height:42px}.pd .vl{margin:6px 0}.pd .vl i{font-size:18px}
.chip{margin-inline-start:auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:700 14px 'Tajawal',sans-serif;cursor:pointer}
.words{color:var(--gd);font-weight:700;margin:8px 4px 0;min-height:22px}
@media print{header,.btn,.ib,#toast{display:none}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div><input type="file" id="imp" accept=".json,application/json" hidden onchange="impF(this.files[0])">
<script>
let db={c:[],t:[],n:1},view='home',sel=0,rows=[{}],pend=0,cur='usd',user=null,imp=null,cloud=null,ro=false,seen={};
try{const s=localStorage.getItem('dijla-debts');if(s)db=JSON.parse(s)}catch(e){}
const legacy=JSON.parse(JSON.stringify(db));legacy.c=legacy.c||[];legacy.t=legacy.t||[];
const save=()=>{try{localStorage.setItem(cloud?'dijla-cache':'dijla-debts',JSON.stringify(db))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const CU={usd:'$',iqd:' د.ع'};
const cuOf=t=>t.cu||'usd';
const mc=(n,c)=>f(n)+CU[c||'usd'];
const sumc=(id,k,c)=>db.t.filter(t=>t.c===id&&t.k===k&&cuOf(t)===c).reduce((a,t)=>a+t.a,0);
const balc=(id,c)=>sumc(id,'d',c)-sumc(id,'p',c);
const mb=(a,b)=>{const p=[];if(a)p.push(mc(a,'usd'));if(b)p.push(mc(b,'iqd'));return p.length?p.join(' + '):'0$'};
const bs=id=>mb(balc(id,'usd'),balc(id,'iqd'));
const owes=id=>balc(id,'usd')>0||balc(id,'iqd')>0;
const tot=(k,c)=>db.t.filter(t=>t.k===k&&cuOf(t)===c).reduce((a,t)=>a+t.a,0);
const two=(a,b)=>(a||!b?`<div>${mc(a,'usd')}</div>`:'')+(b?`<div class="d2">${mc(b,'iqd')}</div>`:'');
const after=t=>db.t.filter(x=>x.c===t.c&&cuOf(x)===cuOf(t)&&x.id<=t.id).reduce((a,x)=>a+(x.k==='d'?x.a:-x.a),0);
const rt=r=>(+r.q||1)*(+r.p||0);
const cn=id=>(db.c.find(c=>c.id===id)||{}).name||'';
const toast=t=>{const e=$('#toast');e.textContent=t;e.className='on';setTimeout(()=>e.className='',2000)};
const U=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const TN=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
const HN=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
function t3(n){const h=Math.floor(n/100),r=n%100,p=[];if(h)p.push(HN[h]);if(r){if(r<20)p.push(U[r]);else{if(r%10)p.push(U[r%10]);p.push(TN[Math.floor(r/10)])}}return p.join(' و')}
function tafq(n){
 n=Math.floor(n);if(!n)return 'صفر';
 const sc=[0,['ألف','ألفان','آلاف','ألف'],['مليون','مليونان','ملايين','مليون'],['مليار','ملياران','مليارات','مليار']],P=[];
 for(let i=0;n>0&&i<4;i++){const g=n%1000;n=Math.floor(n/1000);
  if(g){if(!i)P.unshift(t3(g));else{const s=sc[i];P.unshift(g===1?s[0]:g===2?s[1]:t3(g)+' '+(g<=10?s[2]:s[3]))}}}
 return P.join(' و');
}
const wd=t=>tafq(t.a)+' '+(cuOf(t)==='usd'?'دولاراً أمريكياً':'ديناراً عراقياً')+' فقط لا غير';
const segH=()=>`<div class="seg"><button class="${cur==='usd'?'on':''}" onclick="setCur('usd')">دولار $</button><button class="${cur==='iqd'?'on':''}" onclick="setCur('iqd')">دينار د.ع</button></div>`;
function setCur(c){cur=c;document.querySelectorAll('.seg button').forEach((b,i)=>b.className=(i?'iqd':'usd')===c?'on':'');tt();if(view==='pay')pb()}
let authTab='in';
const LS={g:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('dijla|'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'dijla|'+p)h=(h*33^c.charCodeAt(0))>>>0;return 'x'+h}}
function authView(){
 const reg=authTab==='up';
 $('#app').innerHTML=`<header><h2>معرض دجلة</h2></header><h1>سجل الديون</h1><p class="sub">${reg?'أنشئ حساب مستخدم جديد':'سجّل الدخول للمتابعة'}</p>
 <div class="seg"><button class="${reg?'':'on'}" onclick="authTab='in';render()">تسجيل الدخول</button><button class="${reg?'on':''}" onclick="authTab='up';render()">حساب جديد</button></div>
 ${reg?'<label>الاسم</label><input id="un" autocomplete="name">':''}
 <label>اسم المستخدم</label><input id="us" autocomplete="username" autocapitalize="none" dir="ltr">
 <label>كلمة المرور</label><input id="pw" type="password" autocomplete="${reg?'new-password':'current-password'}" dir="ltr">
 <button class="btn" onclick="doAuth()">${reg?'إنشاء الحساب':'دخول'}</button>
 <label class="btn o" style="cursor:pointer">استيراد حساب من هاتف آخر<input type="file" accept=".json,application/json" hidden onchange="pickImp(this)"></label><button class="btn o" onclick="$('#imp').click()">لدي ملف حساب من جهاز آخر</button>`;
}
async function doAuth(){
 const us=$('#us').value.trim().toLowerCase(),pw=$('#pw').value;if(!us||!pw)return toast('اكتب اسم المستخدم وكلمة المرور');
 const U=LS.g('dijla-users')||[],h=await hash(pw);
 if(authTab==='up'){
  if(pw.length<4)return toast('كلمة المرور 4 أحرف على الأقل');
  if(U.find(x=>x.u===us))return toast('اسم المستخدم مستخدم من قبل');
  const n=($('#un').value||'').trim()||us;U.push({u:us,h,n});LS.s('dijla-users',U);user={u:us,n};
 }else{
  const x=U.find(y=>y.u===us&&y.h===h);if(!x)return toast('اسم المستخدم أو كلمة المرور غير صحيحة');user={u:x.u,n:x.n};
 }
 LS.s('dijla-sess',user.u);view='home';render();
}
function logout(){user=null;LS.s('dijla-sess',null);authTab='in';render()}
async function exportAcc(){
 try{const dl=window.claude?await claude.use('downloads'):null;if(!dl)return toast('التنزيل غير متاح هنا');
  await dl.save({filename:'dijla-debts-'+today()+'.json',data:JSON.stringify({app:'dijla-debts',v:1,users:LS.g('dijla-users')||[],db})});
 }catch(e){if(!e||e.code!=='declined')toast('تعذر تنزيل الحساب')}
}
function impF(file){
 if(!file)return;const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);if(d.app!=='dijla-debts'||!d.db||!Array.isArray(d.db.c)||!Array.isArray(d.db.t))throw 0;
  if(cloud){migrate(d.db);return}
  const U=LS.g('dijla-users')||[];(d.users||[]).forEach(x=>{if(x&&x.u&&x.h&&!U.find(y=>y.u===x.u))U.push({u:x.u,h:x.h,n:x.n||x.u})});LS.s('dijla-users',U);
  const nm=id=>(d.db.c.find(c=>c.id===id)||{}).name;
  const sig=(n,t)=>[n,t.k,cuOf(t),t.a,t.d,t.no||'',t.note||'',JSON.stringify(t.items||[])].join('|');
  const have=new Set(db.t.map(t=>sig(cn(t.c),t)));let nc=0,nt=0;
  d.db.c.forEach(c=>{if(!c.name)return;let x=db.c.find(y=>y.name===c.name);if(!x){x={id:db.n++,name:c.name,phone:c.phone||''};db.c.push(x);nc++}else if(!x.phone&&c.phone)x.phone=c.phone});
  d.db.t.forEach(t=>{const n=nm(t.c);if(!n)return;const g=sig(n,t);if(have.has(g))return;have.add(g);const c=db.c.find(y=>y.name===n);db.t.push({...t,id:db.n++,c:c.id});nt++});
  save();authTab='in';render();toast(`تم الدمج: ${nc} زبون جديد و${nt} حركة جديدة`+(user?'':' - سجّل الدخول الآن'));
 }catch(e){toast('الملف غير صالح')}$('#imp').value=''};
 r.readAsText(file);
}
async function exportAcc(){
 const dl=window.claude?await claude.use('downloads'):null;if(!dl)return toast('التنزيل غير متاح هنا');
 try{await dl.save({filename:'dijla-debts-'+today()+'.json',data:JSON.stringify({app:'dijla-debts',v:1,users:LS.g('dijla-users')||[],db})})}catch(e){if(!e||e.code!=='declined')toast('تعذر تنزيل الملف')}
}
async function pickImp(inp){
 const fl=inp.files[0];if(!fl)return;
 try{const j=JSON.parse(await fl.text());if(j.app!=='dijla-debts'||!j.db||!Array.isArray(j.db.c)||!Array.isArray(j.db.t))throw 0;imp=j;view='imp';render()}catch(e){toast('الملف غير صالح')}
 inp.value='';
}
function applyImp(){
 if(cloud){migrate(imp.db).then(ok=>{if(ok){imp=null;view='home';render()}});return}
 const m=LS.g('dijla-users')||[];
 (imp.users||[]).forEach(x=>{const i=m.findIndex(y=>y.u===x.u);if(i<0)m.push(x);else m[i]=x});
 LS.s('dijla-users',m);db=imp.db;save();imp=null;authTab='in';view='home';render();toast(user?'تم استيراد البيانات':'تم الاستيراد، سجّل الدخول');
}
let lastId=0;
const nid=()=>{let v=Date.now()*1000+Math.floor(Math.random()*1000);if(v<=lastId)v=lastId+1;return lastId=v};
function put(col,o){
 const a=col==='customers'?db.c:db.t,i=a.findIndex(x=>x.id===o.id);if(i<0)a.push(o);else a[i]=o;save();
 if(cloud)cloud.doc(col+'/'+o.id).set(o).catch(()=>toast('تعذر الحفظ في القاعدة'));
}
function drop(id){db.t=db.t.filter(t=>t.id!==id);save();if(cloud)cloud.doc('txs/'+id).delete().catch(()=>toast('تعذر الحذف من القاعدة'))}

function listen(){

 cloud.collection('customers').onSnapshot(s=>{db.c=s.docs.map(d=>d.data()).sort((a,b)=>a.id-b.id);if(!s.metadata.fromCache)seen.c=1;synced()},er);
 cloud.collection('txs').onSnapshot(s=>{db.t=s.docs.map(d=>d.data()).sort((a,b)=>a.id-b.id);if(!s.metadata.fromCache)seen.t=1;synced()},er);
}
const hasLegacy=()=>cloud&&!ro&&!LS.g('dijla-mig')&&(legacy.c.length+legacy.t.length)>0;
async function migrate(src){
 if(!cloud||ro){toast('غير متاح');return false}
 toast('جاري الرفع...');const map={};
 try{
  for(const c of [...src.c].sort((a,b)=>a.id-b.id)){
   const ex=db.c.find(x=>x.name.trim().toLowerCase()===c.name.trim().toLowerCase());
   if(ex){map[c.id]=ex.id;continue}
   const n={id:nid(),name:c.name,phone:c.phone||''};map[c.id]=n.id;db.c.push(n);await cloud.doc('customers/'+n.id).set(n);
  }
  const nm=id=>(src.c.find(c=>c.id===id)||{}).name;
  const sig=(n,t)=>[n,t.k,cuOf(t),t.a,t.d,t.no||'',t.note||'',JSON.stringify(t.items||[])].join('|');
  const have=new Set(db.t.map(t=>sig(cn(t.c),t)));let k=0;
  for(const t of [...src.t].sort((a,b)=>a.id-b.id)){
   if(!map[t.c])continue;const g=sig(nm(t.c),t);if(have.has(g))continue;have.add(g);
   const n={...t,id:nid(),c:map[t.c]};db.t.push(n);await cloud.doc('txs/'+n.id).set(n);k++;
  }
  toast(k?`تمت إضافة ${k} حركة إلى القاعدة`:'لا توجد حركات جديدة');return true;
 }catch(e){toast('تعذر الرفع، حاول مرة ثانية');return false}
}

}

async function mk(title,body,fn,mode){
 toast('جاري إنشاء الملف...');
 const box=document.createElement('div');box.className='pd'+(mode?' v':'');
 box.innerHTML=mode?body:`<img class="bn" src="${HDR}">${title?`<div class="pt">${title}</div>`:''}${body}${title?`<div class="pf">${new Date().toLocaleDateString('ar-IQ-u-nu-latn')}</div>`:''}`;
 document.body.appendChild(box);
 try{
  const dl=window.claude?await claude.use('downloads'):null;if(!dl)return toast('التصدير غير متاح هنا');
  await document.fonts.ready;
  const cv=await html2canvas(box,{scale:2,backgroundColor:'#ffffff'});
  const doc=new window.jspdf.jsPDF(mode?'l':'p','mm',mode?'a5':'a4'),pw=cv.width,ph=Math.floor(pw*(mode?148:297)/210);
  for(let y=0,i=0;y<cv.height;y+=ph,i++){
   const c=document.createElement('canvas');c.width=pw;c.height=Math.min(ph,cv.height-y);
   const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(cv,0,y,pw,c.height,0,0,pw,c.height);
   if(i)doc.addPage();
   doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,c.height*210/pw);
  }
  await dl.save({filename:fn.replace(/[\\/:*?"<>|]/g,'')+'.pdf',data:doc.output('blob')});
 }catch(e){if(!e||e.code!=='declined')toast('تعذر إنشاء الملف')}
 finally{box.remove()}
}

 mk('كشف حساب '+esc(cn(sel)),T3(['التاريخ','البيان','مدين','دائن','الرصيد'],T.map(t=>{const c=cuOf(t);run[c]+=t.k==='d'?t.a:-t.a;return [t.d,t.k==='d'?(t.items||[]).map(i=>esc(i.d||'بند')).join('، '):'سند قبض'+(t.no?' '+t.no:''),t.k==='d'?mc(t.a,c):'',t.k==='p'?mc(t.a,c):'',mc(run[c],c)]}))+`<div class="tt"><span>المتبقي</span><span>${bs(sel)}</span></div>`,'كشف '+cn(sel));
}
function pdfC(){
 mk('جرد الزبائن',T3(['#','الزبون','الهاتف','الديون','المقبوض','المتبقي'],db.c.map((c,i)=>[i+1,esc(c.name),esc(c.phone||''),mb(sumc(c.id,'d','usd'),sumc(c.id,'d','iqd')),mb(sumc(c.id,'p','usd'),sumc(c.id,'p','iqd')),bs(c.id)]))+`<div class="tt"><span>إجمالي المتبقي (${db.c.length} زبون)</span><span>${mb(tot('d','usd')-tot('p','usd'),tot('d','iqd')-tot('p','iqd'))}</span></div>`,'جرد الزبائن '+today());
}
